<ng-template [ngIf]="projectsData.length" [ngIfElse]="elseTemplate">
  <div class="card-grid">
    <div *ngFor="let item of projectsData; let i = index" [appReveal]="i">
      <app-summary-item appTilt class="card h-full" [item]="item"></app-summary-item>
    </div>
  </div>
</ng-template>

<ng-template #elseTemplate>
  <p class="text-muted">{{ 'EMPTY.PROJECT' | translate }}</p>
</ng-template>
