<h3 class="summary-title">
  <ng-template
    [ngIf]="item?.link || item?.internal_link"
    [ngIfElse]="elseTemplate"
  >
    <a *ngIf="item?.link" class="link-underline" [href]="item?.link" target="_blank">
      {{ item?.name | translate }}
    </a>

    <a *ngIf="item?.internal_link" class="link-underline" [routerLink]="item?.internal_link">
      {{ item?.name | translate }}
    </a>
  </ng-template>

  <ng-template #elseTemplate>
    {{ item?.name | translate }}
  </ng-template>
</h3>

<ul *ngIf="isList(item.description); else textTemplate" class="summary-tags">
  <li *ngFor="let tag of item.description" class="pill" appFloat>{{ tag | translate }}</li>
</ul>

<ng-template #textTemplate>
  <p class="summary-text">
    {{ item.description | translate }}
  </p>
</ng-template>
