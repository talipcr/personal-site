<div
  fxLayout="column"
  fxLayoutAlign="center center"
  fxFlex
  style="height: 100vh"
  *ngIf="loading; else elseTemplate"
>
  <app-loader-spinner></app-loader-spinner>
</div>

<app-neural-background></app-neural-background>

<ng-template #elseTemplate>
  <app-layout>
    <app-header *ngIf="currentRoute !== '/404'"></app-header>
    <main #page>
      <router-outlet (activate)="animatePage(page)"></router-outlet>
    </main>
    <app-footer *ngIf="currentRoute !== '/404'"></app-footer>
  </app-layout>
</ng-template>
